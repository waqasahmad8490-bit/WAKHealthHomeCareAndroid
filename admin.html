<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#063b67"><title>WAK Business Management</title>
<style>
:root{--navy:#063b67;--teal:#0b8f89;--ink:#173348;--muted:#64798a;--line:#dce6ed;--bg:#f3f7fa;--white:#fff;--red:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}header{background:var(--navy);color:white;padding:16px 22px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}header strong{font-size:18px}header small{display:block;color:#c8dbe8;margin-top:3px}.wrap{max-width:1400px;margin:auto;padding:20px}.login{max-width:460px;margin:8vh auto;background:white;border:1px solid var(--line);border-radius:16px;padding:26px;box-shadow:0 10px 36px #16364b12}.login h1{margin-top:0;color:var(--navy)}label{display:block;font-size:13px;font-weight:700;margin:12px 0 6px}input,select,textarea{width:100%;padding:11px;border:1px solid #cbd8e1;border-radius:8px;background:white;color:var(--ink)}textarea{min-height:76px;resize:vertical}.btn{border:0;border-radius:8px;background:var(--navy);color:white;padding:10px 14px;font-weight:700}.btn.teal{background:var(--teal)}.btn.alt{background:#eaf1f5;color:var(--navy)}.btn.danger{background:#fff0ef;color:var(--red)}.btn:disabled{opacity:.6;cursor:wait}.status{padding:11px 13px;border-radius:8px;background:#edf6f8;margin:12px 0;font-size:14px;overflow-wrap:anywhere}.status.error{background:#fff0ef;color:#9c2018}.status.success{background:#e9f7ef;color:#17663a}.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}.stat,.panel{background:white;border:1px solid var(--line);border-radius:13px;padding:17px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:25px;color:var(--navy);margin-top:7px}.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px}.nav{background:white;border:1px solid var(--line);border-radius:13px;padding:10px;height:max-content;position:sticky;top:10px}.nav button{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--ink);padding:11px;border-radius:8px;margin:2px 0}.nav button.active,.nav button:hover{background:#e9f3f6;color:var(--navy);font-weight:800}.content h1{font-size:24px;color:var(--navy);margin:0 0 6px}.muted{color:var(--muted);font-size:13px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0}.toolbar input{max-width:280px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px}table{border-collapse:collapse;width:100%;min-width:680px;background:white}th,td{padding:11px 12px;text-align:left;border-bottom:1px solid #e8eef2;font-size:13px;vertical-align:top}th{background:#f4f8fa;color:#425c6e}td .btn{padding:6px 9px;font-size:12px}.empty{padding:24px;color:var(--muted);text-align:center}.modal{position:fixed;inset:0;background:#09243888;display:flex;align-items:center;justify-content:center;padding:15px;z-index:10}.modalbox{background:white;border-radius:14px;width:min(760px,100%);max-height:92vh;overflow:auto;padding:22px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}.wide{grid-column:1/-1}.modalhead{display:flex;justify-content:space-between;align-items:center;gap:12px}.reportgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.notice{font-size:13px;color:var(--muted);line-height:1.5}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#eaf4f4;color:#0b716d;font-size:11px;font-weight:800}.pill.warn{background:#fff4df;color:#875a00}@media(max-width:900px){.layout{grid-template-columns:1fr}.nav{position:static;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.reportgrid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.wrap{padding:12px}.stats{gap:8px}.stat{padding:12px}.stat strong{font-size:21px}.nav{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.wide{grid-column:auto}.reportgrid{grid-template-columns:1fr}header{padding:14px}}
</style></head><body>
<header><div><strong>WAK Health &amp; Home Care</strong><small>Business Management System · Abbottabad</small></div><div><span id="userLabel" class="muted" style="color:#d4e5ee"></span> <button id="logoutBtn" class="btn alt hidden">Sign out</button></div></header>
<main class="wrap"><section id="loginPanel" class="login"><h1>Staff Sign In</h1><p class="muted">Authorized WAK team members only.</p><form id="loginForm"><label>Email</label><input id="email" type="email" required autocomplete="username"><label>Password</label><input id="password" type="password" required autocomplete="current-password"><div style="margin-top:16px"><button class="btn" type="submit">Sign in securely</button></div></form><div id="loginStatus" class="status hidden" role="status"></div><p class="notice">Login accounts must be created by an administrator in Supabase. Public sign-up is disabled by design.</p></section>
<section id="appPanel" class="hidden"><div class="topline"><div><h1 id="pageTitle" style="margin:0;color:var(--navy)">Dashboard</h1><span class="muted" id="pageSubtitle">WAK operations overview</span></div><button class="btn teal" id="newBtn">+ Add New</button></div><div id="status" class="status hidden" role="status"></div><div id="stats" class="stats"></div><div class="layout"><nav id="nav" class="nav"></nav><section class="content"><div id="view"></div></section></div></section></main>
<div id="modal" class="modal hidden"><div class="modalbox"><div class="modalhead"><h2 id="modalTitle" style="margin:0;color:var(--navy)">Add record</h2><button id="closeModal" class="btn alt" type="button">Close</button></div><form id="recordForm"><div id="formFields" class="formgrid"></div><div class="toolbar"><button class="btn teal" id="saveBtn" type="submit">Save Record</button><button class="btn alt" id="cancelModal" type="button">Cancel</button></div></form></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase-config.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id),cfg=window.WAK_SUPABASE||{};let db=null,user=null,role=null,staffProfile=null,active='dashboard',editing=null,records=[],lookup={patients:[],staff:[]};
const modules={patients:{title:'Patients',table:'wak_patients',roles:['admin','receptionist','finance'],fields:[['full_name','Patient name','text',true],['phone','Phone','tel',true],['age','Age','number'],['gender','Gender','select',['','Female','Male','Other']],['area','Area / locality','text'],['address','Address','textarea'],['emergency_contact','Emergency contact','text'],['notes','Notes (avoid unnecessary sensitive details)','textarea']],cols:['full_name','phone','age','area','created_at']},appointments:{title:'Appointments',table:'wak_appointments',roles:['admin','receptionist','finance','nurse','physiotherapist','doctor'],fields:[['patient_id','Linked patient','selectPatients'],['patient_name','Patient name (if not linked)','text'],['phone','Phone','tel'],['service','Service','select',['Home Nursing Care','Physiotherapy Home Visit','Family Physician Home Visit','24/7 Care','Other']],['scheduled_at','Date & time','datetime-local',true],['address','Visit address','textarea'],['assigned_staff_id','Assign staff','selectStaff'],['status','Status','select',['pending','confirmed','in_progress','completed','cancelled']],['notes','Notes','textarea']],cols:['patient_name','service','scheduled_at','status','assigned_staff_id']},cases:{title:'Care Cases',table:'wak_cases',roles:['admin','receptionist','nurse','physiotherapist','doctor'],fields:[['patient_id','Patient','selectPatients',true],['case_type','Case type','select',['nursing','physiotherapy','family physician','other']],['diagnosis_or_goal','Diagnosis / goal','text'],['care_plan','Care plan','textarea'],['start_date','Start date','date'],['end_date','End date','date'],['sessions_planned','Sessions planned','number'],['sessions_completed','Sessions completed','number'],['assigned_staff_id','Assigned staff','selectStaff'],['status','Status','select',['active','on_hold','completed','closed']],['notes','Progress / handover notes','textarea']],cols:['patient_id','case_type','diagnosis_or_goal','sessions_completed','status','assigned_staff_id']},transactions:{title:'Accounts & Payments',table:'wak_transactions',roles:['admin','receptionist','finance'],fields:[['transaction_date','Date','date',true],['kind','Type','select',['income','expense','staff_payment','refund'],true],['category','Category','text',true],['amount','Amount (PKR)','number',true],['patient_id','Patient (optional)','selectPatients'],['staff_id','Staff (optional)','selectStaff'],['payment_method','Payment method','select',['cash','bank transfer','easypaisa','jazzcash','other']],['description','Description','textarea']],cols:['transaction_date','kind','category','amount','payment_method','description']},bookings:{title:'Website Booking Requests',table:'wak_booking_requests',roles:['admin','receptionist','finance'],fields:[['full_name','Contact name','text',true],['phone','Phone','tel',true],['service','Service','text',true],['preferred_date','Preferred date','date'],['preferred_time','Preferred time','text'],['area','Area','text'],['address','Address','textarea'],['message','Message','textarea'],['status','Status','select',['new','contacted','scheduled','completed','declined']],['created_at','Received at','readonly']],cols:['full_name','phone','service','preferred_date','status','created_at']},staff:{title:'Staff & Access',table:'wak_staff',roles:['admin'],fields:[['full_name','Staff name','text',true],['email','Login email','email'],['phone','Phone','tel'],['role','Role','select',['admin','receptionist','nurse','physiotherapist','doctor','finance'],true],['user_id','Supabase Auth User UUID','text'],['active','Active','select',['true','false'],true]],cols:['full_name','email','phone','role','active']},updates:{title:'Website Notice Board',table:'wak_updates',roles:['admin'],fields:[['category','Category','select',['Announcement','News','Health Information','Services','Documents']],['title','Title','text',true],['description','Description','textarea',true],['link_url','External URL','url'],['link_text','Link label','text'],['attachment','Upload PDF / image (max 15 MB)','file'],['is_published','Published','select',['true','false'],true]],cols:['title','category','is_published','published_at']}};
const navItems=[['dashboard','Dashboard','◫'],['patients','Patients','♡'],['appointments','Appointments','▦'],['cases','Nursing & PT Cases','✚'],['bookings','Website Bookings','⌂'],['transactions','Accounts & Payments','₨'],['staff','Staff & Permissions','♙'],['updates','Website Updates','▤'],['reports','Reports & Profit','▥']];
function msg(s,type=''){ $('status').textContent=s;$('status').className='status'+(type?' '+type:'');$('status').classList.remove('hidden');}function hideMsg(){$('status').classList.add('hidden')}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function nice(k){return k.replace(/_/g,' ').replace(/\b\w/g,x=>x.toUpperCase())}function fmt(v,k){if(v==null||v==='')return '—';if(k==='amount')return 'PKR '+Number(v).toLocaleString('en-PK');if(['scheduled_at','created_at','published_at'].includes(k)){let d=new Date(v);return isNaN(d)?esc(v):d.toLocaleString()}if(k==='patient_id'){let p=lookup.patients.find(x=>x.id===v);return esc(p?.full_name||String(v).slice(0,8))}if(k==='assigned_staff_id'||k==='staff_id'){let s=lookup.staff.find(x=>x.id===v);return esc(s?.full_name||String(v).slice(0,8))}if(k==='is_published'||k==='active')return v?'Yes':'No';return esc(v)}
async function loadLookups(){let a=await db.from('wak_patients').select('id,full_name').order('full_name').limit(500);if(!a.error)lookup.patients=a.data||[];let b=await db.from('wak_staff').select('id,full_name,role,active').order('full_name').limit(500);if(!b.error)lookup.staff=b.data||[]}
function allowed(m){return modules[m].roles.includes(role)}function renderNav(){ $('nav').innerHTML=navItems.filter(([id])=>id==='dashboard'||id==='reports'||(modules[id]&&allowed(id))).map(([id,label,ico])=>`<button type="button" data-nav="${id}" class="${active===id?'active':''}">${ico} &nbsp;${label}</button>`).join('');}
function setTitle(title,sub=''){ $('pageTitle').textContent=title;$('pageSubtitle').textContent=sub; }
async function dashboard(){setTitle('Dashboard','WAK operations overview');$('newBtn').classList.add('hidden');const names=['wak_patients','wak_appointments','wak_cases','wak_booking_requests','wak_transactions'];let counts={};for(let t of names){let r=await db.from(t).select('*',{count:'exact',head:true});counts[t]=r.count||0;}let tx=await db.from('wak_transactions').select('kind,amount');let income=0,expense=0;if(!tx.error)(tx.data||[]).forEach(t=>{if(t.kind==='income')income+=Number(t.amount);else expense+=Number(t.amount)});$('stats').innerHTML=[['Patients',counts.wak_patients],['Appointments',counts.wak_appointments],['Active care cases',counts.wak_cases],['New booking requests',counts.wak_booking_requests]].map(x=>`<div class="stat"><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join('');$('view').innerHTML=`<div class="panel"><h2 style="margin-top:0;color:var(--navy)">Financial snapshot</h2><div class="reportgrid"><div><small class="muted">Recorded income</small><h2>PKR ${income.toLocaleString('en-PK')}</h2></div><div><small class="muted">Recorded outflow</small><h2>PKR ${expense.toLocaleString('en-PK')}</h2></div><div><small class="muted">Net recorded balance</small><h2>PKR ${(income-expense).toLocaleString('en-PK')}</h2></div></div><p class="notice">Figures include only transactions entered in this system. Refunds and staff payments should be entered consistently to keep reports meaningful.</p></div><div class="panel"><h2 style="margin-top:0;color:var(--navy)">Quick actions</h2><div class="toolbar"><button class="btn teal" data-quick="patients">+ Register patient</button><button class="btn" data-quick="appointments">+ Book appointment</button><button class="btn alt" data-quick="transactions">+ Record payment</button></div><p class="notice">Use the left menu to manage records. Patient clinical information should be limited to what is needed for care coordination.</p></div>`;}
async function reports(){setTitle('Reports & Profit','Based on records entered in the system');$('newBtn').classList.add('hidden');const r=await db.from('wak_transactions').select('*').order('transaction_date',{ascending:false});if(r.error){msg(r.error.message,'error');return}let totals={income:0,expense:0,staff_payment:0,refund:0};(r.data||[]).forEach(x=>totals[x.kind]=(totals[x.kind]||0)+Number(x.amount));let net=totals.income-totals.expense-totals.staff_payment-totals.refund;$('stats').innerHTML='';$('view').innerHTML=`<div class="panel"><h2 style="margin-top:0;color:var(--navy)">Financial summary (PKR)</h2><div class="reportgrid">${[['Income',totals.income],['Expenses',totals.expense],['Staff payments',totals.staff_payment],['Refunds',totals.refund],['Net recorded profit',net]].map(([a,b])=>`<div class="stat"><small>${a}</small><strong style="font-size:22px">${Number(b).toLocaleString('en-PK')}</strong></div>`).join('')}</div><p class="notice">Net is calculated as income − expenses − staff payments − refunds. It is not an audited profit figure and excludes transactions not entered here.</p><button class="btn alt" id="exportCsv">Export transactions CSV</button></div>`;$('exportCsv').onclick=()=>downloadCsv(r.data||[],'wak-transactions.csv');}
function downloadCsv(rows,name){if(!rows.length){msg('No records to export.');return}let keys=[...new Set(rows.flatMap(Object.keys))];let csv=[keys.join(','),...rows.map(r=>keys.map(k=>'"'+String(r[k]??'').replace(/"/g,'""')+'"').join(','))].join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
async function showModule(m){if(!modules[m]||!allowed(m)){msg('Your account does not have permission to open this section.','error');return}active=m;renderNav();setTitle(modules[m].title,'Manage '+modules[m].title.toLowerCase());$('newBtn').classList.remove('hidden');$('newBtn').textContent=m==='updates'?'+ New Update':m==='bookings'? '':'+ Add '+(m==='cases'?'Case':m==='transactions'?'Transaction':m==='staff'?'Staff Member':m==='patients'?'Patient':m==='appointments'?'Appointment':'Record');if(m==='bookings')$('newBtn').classList.add('hidden');await loadLookups();const cfgm=modules[m];let q=db.from(cfgm.table).select('*').order('created_at',{ascending:false}).limit(500);if(m==='appointments')q=db.from(cfgm.table).select('*').order('scheduled_at',{ascending:false}).limit(500);if(m==='transactions')q=db.from(cfgm.table).select('*').order('transaction_date',{ascending:false}).limit(500);if(m==='bookings')q=db.from(cfgm.table).select('*').order('created_at',{ascending:false}).limit(500);let res=await q;if(res.error){$('view').innerHTML='';msg('Could not load records: '+res.error.message,'error');return}records=res.data||[];renderTable(m,records);}
function renderTable(m,rows){let c=modules[m].cols;$('stats').innerHTML='';$('view').innerHTML=`<div class="panel"><div class="toolbar"><input id="searchRows" placeholder="Search records…" aria-label="Search records"><button class="btn alt" id="exportRows">Export CSV</button><span class="muted">${rows.length} record(s)</span></div><div class="tablewrap"><table><thead><tr>${c.map(k=>`<th>${nice(k)}</th>`).join('')}<th>Actions</th></tr></thead><tbody id="tableBody">${rows.map(r=>rowHtml(m,r,c)).join('')||`<tr><td colspan="${c.length+1}" class="empty">No records yet.</td></tr>`}</tbody></table></div></div>`;$('searchRows').oninput=()=>{let s=$('searchRows').value.toLowerCase();let filtered=rows.filter(r=>Object.values(r).some(v=>String(v??'').toLowerCase().includes(s)));$('tableBody').innerHTML=filtered.map(r=>rowHtml(m,r,c)).join('')||`<tr><td colspan="${c.length+1}" class="empty">No matching records.</td></tr>`};$('exportRows').onclick=()=>downloadCsv(rows,m+'.csv');}
function rowHtml(m,r,cols){return `<tr>${cols.map(k=>`<td>${fmt(r[k],k)}</td>`).join('')}<td><div class="toolbar" style="margin:0"><button class="btn alt" data-edit="${esc(r.id)}">View / Edit</button>${role==='admin'?`<button class="btn danger" data-delete="${esc(r.id)}">Delete</button>`:''}${m==='bookings'?`<button class="btn teal" data-wa="${esc(r.phone||'')}" data-name="${esc(r.full_name||'')}" data-service="${esc(r.service||'')}">WhatsApp</button>`:''}</div></td></tr>`}
async function openForm(m,row=null){editing=row;await loadLookups();$('modalTitle').textContent=(row?'Edit ':'Add ')+modules[m].title;$('formFields').innerHTML=modules[m].fields.map(([k,label,type,extra])=>{let v=row?.[k]??'';if(k==='active'||k==='is_published')v=String(!!v);if(type==='readonly')return `<div><label>${label}</label><input value="${esc(v)}" disabled></div>`;if(type==='file')return `<div class="wide"><label>${label}</label><input name="${k}" type="file" accept=".pdf,.png,.jpg,.jpeg,.webp,.doc,.docx,.xls,.xlsx"><small class="muted">${row?.file_name?'Current file: '+esc(row.file_name):'Optional attachment'}</small></div>`;if(type==='selectPatients'||type==='selectStaff'){let opts=type==='selectPatients'?lookup.patients:lookup.staff;return `<div><label>${label}</label><select name="${k}"><option value="">— Select —</option>${opts.map(o=>`<option value="${esc(o.id)}" ${v===o.id?'selected':''}>${esc(o.full_name)}${o.role?' · '+esc(o.role):''}</option>`).join('')}</select></div>`}if(type==='select'){let opts=extra||[];return `<div><label>${label}${extra===true?' *':''}</label><select name="${k}" ${extra===true?'required':''}>${opts.map(o=>`<option value="${esc(o)}" ${String(v)===String(o)?'selected':''}>${esc(o||'— Select —')}</option>`).join('')}</select></div>`}let val=v;if(type==='datetime-local'&&val)val=new Date(val).toISOString().slice(0,16);return `<div class="${type==='textarea'?'wide':''}"><label>${label}${extra===true?' *':''}</label>${type==='textarea'?`<textarea name="${k}" ${extra===true?'required':''}>${esc(val)}</textarea>`:`<input name="${k}" type="${type}" value="${esc(val)}" ${extra===true?'required':''} ${type==='number'?'min="0"':''} ${k==='amount'?'step="0.01"':''}>`}</div>`}).join('');$('modal').classList.remove('hidden');}
function closeForm(){$('modal').classList.add('hidden');editing=null}
$('recordForm').addEventListener('submit',async e=>{e.preventDefault();if(!modules[active])return;let b=$('saveBtn');b.disabled=true;try{let fd=new FormData(e.target),obj={},uploadFile=fd.get('attachment');for(let [k,v] of fd.entries()){if(['id','created_at','updated_at','attachment'].includes(k))continue;if(v==='')obj[k]=null;else if(['age','sessions_planned','sessions_completed'].includes(k))obj[k]=Number(v);else if(k==='amount')obj[k]=Number(v);else if(['active','is_published'].includes(k))obj[k]=v==='true';else obj[k]=v;}if(active==='updates'&&uploadFile instanceof File&&uploadFile.size){if(uploadFile.size>15*1024*1024)throw new Error('Attachment must be 15 MB or smaller.');const safe=uploadFile.name.replace(/[^a-zA-Z0-9._-]/g,'_');const path=Date.now()+'-'+safe;const up=await db.storage.from('wak-notice-files').upload(path,uploadFile,{upsert:false,contentType:uploadFile.type||'application/octet-stream'});if(up.error)throw up.error;const pub=db.storage.from('wak-notice-files').getPublicUrl(path);obj.file_url=pub.data.publicUrl;obj.file_name=uploadFile.name;}if(active==='appointments'&&obj.scheduled_at)obj.scheduled_at=new Date(obj.scheduled_at).toISOString();if(active==='staff'&&obj.user_id)obj.user_id=obj.user_id.trim();if(active==='patients')obj.updated_at=new Date().toISOString();if(active==='cases')obj.updated_at=new Date().toISOString();let res=editing?await db.from(modules[active].table).update(obj).eq('id',editing.id):await db.from(modules[active].table).insert(obj);if(res.error)throw res.error;closeForm();msg('Record saved successfully.','success');await showModule(active)}catch(err){msg('Could not save: '+err.message,'error')}finally{b.disabled=false}});
$('view').addEventListener('click',async e=>{let edit=e.target.closest('[data-edit]'),del=e.target.closest('[data-delete]'),wa=e.target.closest('[data-wa]'),quick=e.target.closest('[data-quick]');if(quick){active=quick.dataset.quick;await openForm(active);return}if(edit){let row=records.find(x=>String(x.id)===edit.dataset.edit);if(row)await openForm(active,row);return}if(del){if(!confirm('Permanently delete this record?'))return;let res=await db.from(modules[active].table).delete().eq('id',del.dataset.delete);if(res.error){msg(res.error.message,'error');return}msg('Record deleted.','success');await showModule(active);return}if(wa){let phone=String(wa.dataset.wa||'').replace(/\D/g,'');if(phone.startsWith('0'))phone='92'+phone.slice(1);let text=`Assalam-o-Alaikum ${wa.dataset.name||''}, this is WAK Health & Home Care Abbottabad regarding your ${wa.dataset.service||'home visit'} request. Please let us know a convenient time to discuss details.`;window.open('https://wa.me/'+phone+'?text='+encodeURIComponent(text),'_blank','noopener');}});
$('nav').addEventListener('click',async e=>{let b=e.target.closest('[data-nav]');if(!b)return;hideMsg();active=b.dataset.nav;if(active==='dashboard')await dashboard();else if(active==='reports')await reports();else await showModule(active);renderNav()});$('newBtn').onclick=()=>openForm(active);$('closeModal').onclick=closeForm;$('cancelModal').onclick=closeForm;$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeForm()});$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginStatus').classList.add('hidden');if(!cfg.url||!cfg.anonKey||cfg.url.includes('YOUR_PROJECT')||cfg.anonKey.includes('YOUR_SUPABASE')){$('loginStatus').textContent='Setup required: enter your Supabase Project URL and anon/public key in supabase-config.js.';$('loginStatus').className='status error';return}try{if(!db)db=window.supabase.createClient(cfg.url,cfg.anonKey);let r=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)throw r.error;user=r.data.user;let s=await db.from('wak_staff').select('*').eq('user_id',user.id).eq('active',true).maybeSingle();if(s.error||!s.data){await db.auth.signOut();throw new Error('This login is not assigned an active WAK staff role. Contact the administrator.')}staffProfile=s.data;role=s.data.role;$('userLabel').textContent=s.data.full_name+' · '+role;$('loginPanel').classList.add('hidden');$('appPanel').classList.remove('hidden');$('logoutBtn').classList.remove('hidden');renderNav();await dashboard();}catch(err){$('loginStatus').textContent=err.message;$('loginStatus').className='status error'}});$('logoutBtn').onclick=async()=>{if(db)await db.auth.signOut();user=null;role=null;$('appPanel').classList.add('hidden');$('loginPanel').classList.remove('hidden');$('logoutBtn').classList.add('hidden');$('userLabel').textContent=''};
$('view').addEventListener('change',()=>{});document.addEventListener('DOMContentLoaded',()=>{});
})();
